<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПенШоп Админка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
  nav { background: #1a2332; padding: 14px 28px; display: flex; gap: 28px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  nav .brand { color: #fff; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
  nav a { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 4px 0; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  nav a:hover, nav a.active { color: #fff; border-color: #3b82f6; }
  .container { max-width: 1060px; margin: 36px auto; padding: 0 24px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; color: #1e293b; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #334155; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 22px 24px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8fafc; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; padding: 10px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8fafc; }
  .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: opacity .15s; line-height: 1.4; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-gray    { background: #94a3b8; color: #fff; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge-pitching { background: #fef9c3; color: #854d0e; }
  .badge-agreed   { background: #dcfce7; color: #166534; }
  .badge-none     { background: #f1f5f9; color: #64748b; }
  .empty { text-align: center; color: #94a3b8; padding: 48px 0; font-size: 14px; }
  code { font-family: 'Courier New', monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  input[type=text] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 270px; outline: none; }
  input[type=text]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  form { display: inline; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<nav>
  <span class="brand">✒ ПенШоп</span>
  <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Диалоги</a>
  <a href="/groups" {% if request.url.path.startswith('/groups') %}class="active"{% endif %}>Группы</a>
  <a href="/channels" {% if request.url.path.startswith('/channels') %}class="active"{% endif %}>Каналы</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
