name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/niknik516-1/tg-sales-bot

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listener, ai-worker, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to VPS
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: 77.83.87.29
          username: claude
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            export KUBECONFIG=/home/claude/.kube/config

            cd /var/develop/tg-sales-bot
            git fetch origin main
            git checkout main
            git pull

            if kubectl get ns tg-sales-bot >/dev/null 2>&1; then
              # k3s deployment
              docker compose down 2>/dev/null || true
              kubectl create secret docker-registry ghcr-secret \
                --docker-server=ghcr.io \
                --docker-username="$GITHUB_ACTOR" \
                --docker-password="$GHCR_TOKEN" \
                -n tg-sales-bot \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -k k8s/
              kubectl rollout restart deployment/listener deployment/ai-worker deployment/admin -n tg-sales-bot
              kubectl rollout status deployment/ai-worker deployment/admin -n tg-sales-bot --timeout=120s
            else
              # docker-compose fallback
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker compose pull listener ai-worker admin
              docker compose up -d
              docker image prune -f
            fi
