name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/niknik516-1/tg-sales-bot

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listener, ai-worker, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to VPS
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: 77.83.87.29
          username: claude
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            # Fix nginx static files proxy (idempotent — runs once, then no-op)
            sudo python3 -c "
            import subprocess, sys
            path = '/etc/nginx/sites-enabled/antilopa-gnu-ru.conf'
            try:
                cfg = open(path).read()
            except FileNotFoundError:
                sys.exit(0)
            if 'adminka/static' in cfg:
                sys.exit(0)
            block = '    location ^~ /tg-sales-bot/adminka/static/ {\n        proxy_pass http://127.0.0.1:8082/static/;\n        proxy_set_header Host \$host;\n    }\n'
            cfg = cfg.replace('location /tg-sales-bot/adminka/', block + '    location /tg-sales-bot/adminka/')
            open(path, 'w').write(cfg)
            r = subprocess.run(['nginx', '-t'], capture_output=True)
            if r.returncode == 0:
                subprocess.run(['systemctl', 'reload', 'nginx'])
            else:
                print('nginx test failed:', r.stderr.decode())
                sys.exit(1)
            "

            cd /var/develop/tg-sales-bot
            git fetch origin main
            git checkout main
            git pull

            if kubectl get ns tg-sales-bot >/dev/null 2>&1; then
              # k3s deployment (после bootstrap)
              kubectl create secret docker-registry ghcr-secret \
                --docker-server=ghcr.io \
                --docker-username="$GITHUB_ACTOR" \
                --docker-password="$GHCR_TOKEN" \
                -n tg-sales-bot \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -k k8s/
              kubectl rollout restart deployment/listener deployment/ai-worker deployment/admin -n tg-sales-bot
              kubectl rollout status deployment/ai-worker deployment/admin -n tg-sales-bot --timeout=120s
            else
              # docker-compose fallback (до bootstrap k3s)
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker compose pull listener ai-worker admin
              docker compose up -d
              docker image prune -f
            fi
