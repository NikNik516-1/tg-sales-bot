# Скопировать в k8s/secret.yaml, заполнить значения из .env, применить вручную:
#   kubectl apply -f k8s/secret.yaml
# Файл k8s/secret.yaml добавлен в .gitignore — не коммитить!
apiVersion: v1
kind: Secret
metadata:
  name: bot-secret
  namespace: tg-sales-bot
type: Opaque
stringData:
  TG_API_ID: ""
  TG_API_HASH: ""
  TG_SESSION_STRING: ""
  MONITORED_CHATS: ""
  KEYWORDS: ""
  ADMIN_TG_ID: ""
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "gpt-4o-mini"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq/"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  ROOT_PATH: "/tg-sales-bot/adminka"
