apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: tg-sales-bot
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus-ds
      url: http://prometheus:9090/tg-sales-bot/prometheus
      isDefault: true
      access: proxy
      editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: tg-sales-bot
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: default
      folder: ''
      type: file
      disableDeletion: true
      editable: false
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: tg-sales-bot
data:
  tg-sales-bot.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10},
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "histogram_quantile(0.5, sum(rate(gpt_response_seconds_bucket[5m])) by (le, call))",
              "legendFormat": "p50 {{call}}",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "histogram_quantile(0.95, sum(rate(gpt_response_seconds_bucket[5m])) by (le, call))",
              "legendFormat": "p95 {{call}}",
              "refId": "B"
            }
          ],
          "title": "GPT Latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "rabbitmq_queue_messages",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ],
          "title": "Queue Depth",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "rate(ai_worker_messages_processed_total[5m])",
              "legendFormat": "processed/s",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "rate(ai_worker_messages_errors_total[5m])",
              "legendFormat": "errors/s",
              "refId": "B"
            }
          ],
          "title": "Message Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.05},
                  {"color": "red", "value": 0.2}
                ]
              },
              "unit": "percentunit",
              "max": 1,
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus-ds"},
              "expr": "rate(ai_worker_messages_errors_total[5m]) / (rate(ai_worker_messages_processed_total[5m]) + rate(ai_worker_messages_errors_total[5m]))",
              "legendFormat": "error ratio",
              "refId": "A"
            }
          ],
          "title": "Error Ratio",
          "type": "gauge"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["tg-sales-bot"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "tg-sales-bot",
      "uid": "tg-sales-bot",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tg-sales-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        env:
        - name: GF_SERVER_ROOT_URL
          value: "https://antilopa-gnu.ru/tg-sales-bot/grafana/"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        ports:
        - containerPort: 3000
          hostPort: 3001
        volumeMounts:
        - name: datasource
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboard
          mountPath: /var/lib/grafana/dashboards
        - name: data
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: datasource
        configMap:
          name: grafana-datasource
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboard
        configMap:
          name: grafana-dashboard
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tg-sales-bot
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
