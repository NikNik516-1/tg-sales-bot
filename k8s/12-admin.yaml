apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: tg-sales-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        image: ghcr.io/niknik516-1/tg-sales-bot/admin:latest
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: bot-secret
        ports:
        - containerPort: 8080
          hostPort: 8082
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: tg-sales-bot
spec:
  selector:
    app: admin
  ports:
  - port: 8080
    targetPort: 8080
