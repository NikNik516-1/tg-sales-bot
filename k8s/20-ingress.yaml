# Ingress + TLS через cert-manager (Фаза 6.3)
# Применять ПОСЛЕ установки cert-manager и настройки Traefik.
# При этом: nginx должен перестать слушать порт 443 (или убрать его).
# Инструкция: docs/k8s-traefik-migration.md (TODO)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nikolka238@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: tg-sales-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
  - hosts:
    - antilopa-gnu.ru
    secretName: antilopa-tls
  rules:
  - host: antilopa-gnu.ru
    http:
      paths:
      - path: /tg-sales-bot/adminka/
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 8080
