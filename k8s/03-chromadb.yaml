apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: tg-sales-bot
spec:
  serviceName: chromadb
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        env:
        - name: ANONYMIZED_TELEMETRY
          value: "False"
        ports:
        - containerPort: 8000
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /chroma/chroma
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: tg-sales-bot
spec:
  selector:
    app: chromadb
  ports:
  - port: 8000
