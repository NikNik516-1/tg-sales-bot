apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: tg-sales-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
      - name: ai-worker
        image: ghcr.io/niknik516-1/tg-sales-bot/ai-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: bot-secret
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        hostPath:
          path: /var/develop/tg-sales-bot/data
          type: Directory
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ai-worker-metrics
  namespace: tg-sales-bot
spec:
  selector:
    app: ai-worker
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-worker
  namespace: tg-sales-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
