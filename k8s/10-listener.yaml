apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener
  namespace: tg-sales-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listener
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: listener
    spec:
      containers:
      - name: listener
        image: ghcr.io/niknik516-1/tg-sales-bot/listener:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: bot-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      imagePullSecrets:
      - name: ghcr-secret
