version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    environment:
      - ANONYMIZED_TELEMETRY=False
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - bot_net

  app:
    build: ./app
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:

networks:
  bot_net:
    driver: bridge
