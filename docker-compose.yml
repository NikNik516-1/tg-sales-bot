version: '3.9'
name: cl_tg-sales-bot

services:
  chromadb:
    image: chromadb/chroma:latest
    environment:
      - ANONYMIZED_TELEMETRY=False
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    image: ghcr.io/niknik516-1/tg-sales-bot/bot:latest
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
    restart: unless-stopped

  admin:
    image: ghcr.io/niknik516-1/tg-sales-bot/admin:latest
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:

networks:
  bot_net:
    driver: bridge
