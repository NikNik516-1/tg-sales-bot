version: '3.9'
name: cl_tg-sales-bot

services:
  chromadb:
    image: chromadb/chroma:latest
    environment:
      - ANONYMIZED_TELEMETRY=False
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  listener:
    build:
      context: .
      dockerfile: services/listener/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    networks:
      - bot_net
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - bot_net
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:
  rabbitmq_data:

networks:
  bot_net:
    driver: bridge
